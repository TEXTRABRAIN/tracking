<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>TEXTRA Tracking</title>
<style>
  html,body{margin:0;padding:0;background:#070d18;}
  body{min-height:100vh;}
  iframe{border:0;width:100%;display:block;background:#070d18;height:100vh;}
  #hint{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
        color:#9fb4c9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
        font-size:15px;line-height:1.6;padding:24px;text-align:center;}
</style>
</head>
<body>
<div id="hint">Tracking wird geladen ...</div>
<script>
(function(){
  var WEBAPP = "https://script.google.com/macros/s/AKfycbxgmvSEWnsqmkBUnc-I_NLd_0akmmkAsDTbrliJRDNrjRJPT1vAdtr8j9UCLC255Y8d/exec";
  var qs = window.location.search || "";
  var hatParams = /[?&]nr=/.test(qs) && /[?&]token=/.test(qs);
  if (!hatParams) {
    document.getElementById("hint").textContent = "Bitte den persönlichen Tracking-Link mit Auftragsnummer öffnen.";
    return;
  }
  var ziel = WEBAPP + qs;
  var geladen = false;

  var f = document.createElement("iframe");
  f.src = ziel;
  f.setAttribute("title", "TEXTRA Tracking");
  document.body.appendChild(f);

  window.addEventListener("message", function(ev){
    var d = ev.data;
    if (d && typeof d.textraHeight === "number" && d.textraHeight > 200) {
      geladen = true;
      var h = document.getElementById("hint");
      if (h && h.parentNode) h.parentNode.removeChild(h);
      f.style.height = d.textraHeight + "px";
    }
  });

  // Falls das Einbetten blockiert wird (z.B. Firefox), direkt weiterleiten.
  setTimeout(function(){ if (!geladen) { window.location.replace(ziel); } }, 2500);
})();
</script>
</body>
</html>
