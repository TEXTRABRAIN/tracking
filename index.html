<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>TEXTRA Tracking</title>
<style>
html{background:#070d18}
body{margin:0;background:radial-gradient(circle at 50% 0%,#0d1a2e,#070d18);padding:0}
*{box-sizing:border-box;margin:0;padding:0}
.phone{width:100%;max-width:380px;margin:0 auto;background:#060d1a;border-radius:16px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;position:relative}
canvas.bg{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0}
.content{position:relative;z-index:1}
.nav{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid rgba(0,173,239,0.18);background:rgba(6,13,26,0.94)}
.nav-tag{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(0,173,239,0.5);font-weight:700;border:1px solid rgba(0,173,239,0.18);padding:3px 8px;border-radius:4px}
.hero{padding:22px 18px 16px;background:linear-gradient(180deg,rgba(0,173,239,0.07) 0%,transparent 100%);position:relative}
.hero-lbl{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#00ADEF;opacity:0.6;margin-bottom:4px}
.hero-nr{font-size:40px;font-weight:900;letter-spacing:-2px;color:#fff;line-height:1}
.hero-firma{font-size:16px;color:rgba(255,255,255,0.42);margin-top:5px;margin-bottom:16px}
#dpdwrap{margin-top:14px}
#dpdwrap:empty{display:none}
.pill{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:100px;font-size:14px;font-weight:700;background:rgba(0,173,239,0.11);color:#00ADEF;border:1px solid rgba(0,173,239,0.26)}
.pill.bereit{background:rgba(61,220,110,0.13);color:#3ddc6e;border-color:rgba(61,220,110,0.45)}
.pill.bereit .sdot{background:#3ddc6e}
.rueckbox{margin-top:14px;padding:12px 16px;border-radius:10px;background:rgba(245,194,66,0.12);border:1px solid rgba(245,194,66,0.5);color:#f5c242;font-size:13px;line-height:1.55;font-weight:600;max-width:520px}
.rueckdetail{margin-top:8px;padding-top:8px;border-top:1px solid rgba(245,194,66,0.3);font-weight:700}
.rueckliste{margin:6px 0 0;padding-left:18px}
.rueckliste li{margin:2px 0}
.sdot{width:8px;height:8px;border-radius:50%;background:#00ADEF;animation:sdot 1.4s ease-in-out infinite}
@keyframes sdot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.2;transform:scale(0.4)}}
.prog{padding:14px 18px 16px;border-top:1px solid rgba(0,173,239,0.1)}
.prog-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.prog-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.28)}
.prog-num{font-size:34px;font-weight:900;color:#fff;letter-spacing:-1px}
.pbar{height:5px;background:rgba(255,255,255,0.06);border-radius:100px;overflow:visible;position:relative}
.pfill{height:100%;width:0%;border-radius:100px;background:linear-gradient(90deg,#00ADEF,#00ADEF);position:relative;transition:width .6s ease}
.ptip{position:absolute;right:-6px;top:-5px;width:15px;height:15px;border-radius:50%;background:#00ADEF;box-shadow:0 0 12px rgba(0,173,239,0.7)}
.igrid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid rgba(0,173,239,0.1)}
.ic{padding:13px 18px;border-right:1px solid rgba(0,173,239,0.08)}
.ic.ac{border-right:none;grid-column:1/-1;background:rgba(0,173,239,0.06)}
.ic-l{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.26);margin-bottom:4px}
.ic-v{font-size:16px;font-weight:700;color:#fff}
.ic.ac .ic-v{color:#00ADEF}
.steps{padding:14px 18px 16px}
.shd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.st-t{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,0.26)}
.st-c{font-size:12px;color:rgba(0,173,239,0.55);font-weight:700}
.step{display:flex;align-items:center;gap:13px;padding:12px 13px;border-radius:10px;margin-bottom:7px;border:1px solid transparent}
.step.done{background:rgba(0,173,239,0.04);border-color:rgba(0,173,239,0.1)}
.step.active{background:rgba(0,173,239,0.09);border-color:rgba(0,173,239,0.28);position:relative;overflow:hidden}
.step.active::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(0,173,239,0.08),transparent);animation:scan 2.4s ease-in-out infinite}
@keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
.step.pending{opacity:0.52}
.dot{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.dot.done{background:linear-gradient(135deg,#00ADEF,#00ADEF)}
.dot.active{background:linear-gradient(135deg,#00ADEF,#00ADEF);animation:dp 2s ease-in-out infinite}
@keyframes dp{0%,100%{box-shadow:0 0 0 0 rgba(0,173,239,0.3)}60%{box-shadow:0 0 0 8px rgba(0,173,239,0.04)}}
.dot.pending{border:1.5px solid rgba(0,173,239,0.3);background:rgba(0,173,239,0.05)}
.di{width:9px;height:9px;border-radius:50%;background:#fff;animation:di 1.5s ease-in-out infinite}
@keyframes di{0%,100%{transform:scale(1)}50%{transform:scale(0.35);opacity:0.5}}
.sn{font-size:15px;font-weight:700}
.step.done .sn{color:rgba(255,255,255,0.42)}
.step.active .sn{color:#00ADEF}
.step.pending .sn{color:rgba(255,255,255,0.65)}
.stime{font-size:11px;color:rgba(255,255,255,0.2);margin-top:1px}
.stime:empty{display:none}
.step.active .stime{color:rgba(0,173,239,0.42)}
.ftr{padding:14px 18px;text-align:center}
.ftr p{font-size:10px;color:rgba(255,255,255,0.55);line-height:1.55}
.ftr a{color:#00ADEF;text-decoration:none}
.load{padding:60px 24px;text-align:center;color:#6c8298;font-size:14px}
.load .sp{width:26px;height:26px;margin:0 auto 14px;border:3px solid rgba(0,173,239,0.2);border-top-color:#00ADEF;border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pillpulse{0%,100%{box-shadow:0 0 0 0 rgba(0,173,239,0)}50%{box-shadow:0 0 26px 2px rgba(0,173,239,0.28)}}
@keyframes pillpulseG{0%,100%{box-shadow:0 0 0 0 rgba(61,220,110,0)}50%{box-shadow:0 0 26px 2px rgba(61,220,110,0.32)}}
@keyframes barglow{0%,100%{box-shadow:0 0 8px rgba(0,173,239,0.25)}50%{box-shadow:0 0 18px rgba(0,173,239,0.6)}}
@keyframes tippulse{0%,100%{box-shadow:0 0 10px rgba(0,173,239,0.55);transform:scale(1)}50%{box-shadow:0 0 20px 4px rgba(0,173,239,0.9);transform:scale(1.18)}}
@media (min-width:720px) and (hover:hover) and (pointer:fine){
  body{padding:0;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .phone{max-width:none;width:100%;min-height:100vh;border-radius:0;margin:0}
  .content{width:100%;max-width:1760px;min-height:100vh;margin:0 auto;display:grid;grid-template-columns:1fr 1.08fr;grid-template-rows:1fr auto auto 1fr auto;column-gap:30px;grid-template-areas:"sp1 sp1" "nav nav" "left steps" "sp2 sp2" "ftr ftr";align-items:stretch}
  .nav{grid-area:nav;height:58px;padding:0 46px}
  .nav svg{height:36px;transform:translateY(-6px)}
  .leftcol{grid-area:left;display:flex;flex-direction:column;justify-content:center}
  .steps{grid-area:steps;border-left:1px solid rgba(0,173,239,0.1);display:flex;flex-direction:column;justify-content:center}
  .ftr{grid-area:ftr}
  .hero{padding:26px 46px 18px}
  #dpdwrap{position:absolute;top:30px;right:46px;margin:0;max-width:250px}
  .hero-nr{font-size:60px}
  .hero-firma{font-size:18px}
  .prog{padding:12px 46px 16px}
  .prog-num{font-size:38px}
  .igrid{grid-template-columns:1fr 1fr 1fr;align-items:start;padding:0 22px}
  .ic{padding:12px 24px}
  .ic.ac{grid-column:auto;border-right:none;background:rgba(0,173,239,0.06)}
  .ic.ac .ic-v{font-weight:700}
  .ic-l{font-size:12px;letter-spacing:2.5px;min-height:2.6em}
  .ic-v{font-size:18px;font-weight:500}
  .steps{padding:16px 46px}
  .step{padding:9px 15px;margin-bottom:5px}
  .dot{width:24px;height:24px}
  .step.pending{opacity:0.66}
  .dot.pending{border:2px solid rgba(0,173,239,0.6);background:rgba(0,173,239,0.1)}
  .steps-list.cols2{column-count:2;column-gap:18px}
  .steps-list.cols2 .step{break-inside:avoid;-webkit-column-break-inside:avoid}
  .ftr{padding:18px;margin-top:0;border-top:none}
  .ftr p{font-size:13px}
  .hero-lbl{font-size:12px;letter-spacing:4px}
  .nav-tag{font-size:11px}
  .prog-lbl{font-size:12px;letter-spacing:3px}
  .st-t{font-size:12px;letter-spacing:3px}
  .st-c{font-size:14px}
  .sn{font-size:17px}
  .stime{font-size:13px;min-height:17px}
  .stime:empty{display:block}
  .pill{font-size:15px;padding:10px 20px;animation:pillpulse 2.6s ease-in-out infinite}
  .pill.bereit{animation:pillpulseG 2.6s ease-in-out infinite}
  .pfill{animation:barglow 2.4s ease-in-out infinite}
  .ptip{animation:tippulse 1.8s ease-in-out infinite}
}
</style>

<script>
// Racing-Hintergrund (identisch zur bisherigen Seite)
(function(){
  var c=document.getElementById('rcanvas'); if(!c)return;
  var ctx=c.getContext('2d'); var phone=c.parentElement;
  function resize(){ c.width=phone.offsetWidth; c.height=phone.offsetHeight; }
  resize(); window.addEventListener('resize',resize);
  var stripes=[
    {y:0.07,h:0.09,speed:0.00008,offset:0,alpha:0.06},
    {y:0.09,h:0.04,speed:0.00013,offset:0.3,alpha:0.1},
    {y:0.105,h:0.015,speed:0.00019,offset:0.6,alpha:0.18},
    {y:0.115,h:0.006,speed:0.00025,offset:0.8,alpha:0.22},
    {y:0.72,h:0.08,speed:-0.00006,offset:0.2,alpha:0.05},
    {y:0.74,h:0.032,speed:-0.00011,offset:0.5,alpha:0.09},
    {y:0.755,h:0.012,speed:-0.00017,offset:0.7,alpha:0.16},
    {y:0.765,h:0.005,speed:-0.00022,offset:0.9,alpha:0.2}
  ];
  var particles=[];
  for(var i=0;i<12;i++){ particles.push({x:Math.random(),y:0.07+Math.random()*0.07,w:0.08+Math.random()*0.15,speed:0.0002+Math.random()*0.0003,alpha:0.3+Math.random()*0.3,layer:Math.random()<0.5?0:1}); }
  var t=0;
  function draw(ts){
    t=(ts||0)*0.4; var W=c.width,H=c.height; ctx.clearRect(0,0,W,H);
    var skew=Math.tan(22*Math.PI/180);
    var dTop=(W>720)?-0.03:0, dBot=(W>720)?0.05:0;
    stripes.forEach(function(s){
      var off=(s.offset+t*s.speed)%1; var sy=(s.y<0.5)?(s.y+dTop):(s.y+dBot);
      var yc=sy*H, hh=s.h*H;
      ctx.save(); ctx.transform(1,0,-skew,1,0,0); ctx.fillStyle='rgba(0,173,239,'+s.alpha+')';
      ctx.fillRect((off-0.5)*W*2.5,yc-hh/2,W*2.5,hh); ctx.restore();
    });
    particles.forEach(function(p){
      var off=(p.x+t*p.speed)%1.5-0.2;
      var yy=p.layer===0?((0.07+dTop)+p.y*0.07)*H:((0.72+dBot)+p.y*0.06)*H;
      ctx.save(); ctx.transform(1,0,-skew,1,0,0);
      var grd=ctx.createLinearGradient(off*W*1.5,0,(off+p.w)*W*1.5,0);
      grd.addColorStop(0,'rgba(0,173,239,0)'); grd.addColorStop(0.5,'rgba(0,173,239,'+p.alpha+')'); grd.addColorStop(1,'rgba(0,173,239,0)');
      ctx.fillStyle=grd; ctx.fillRect(off*W*1.5,yy-1.5,p.w*W*1.5,3); ctx.restore();
    });
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>

  var fertig=false, ersteAntwort=false;

  function q(s){return document.querySelector(s);}
  function esc(x){var d=document.createElement('div');d.textContent=(x==null?'':String(x));return d.innerHTML;}
  function setText(sel,v){var el=q(sel);if(el)el.textContent=(v==null?'':String(v));}
  function showLoad(msg){var l=q('#loadwrap');if(l){l.style.display='block';l.innerHTML=(msg||'Tracking wird geladen ...');}q('#main').style.display='none';}
  function showErr(msg){var l=q('#loadwrap');if(l){l.style.display='block';l.textContent=msg;}q('#main').style.display='none';}

  function param(){
    var p=new URLSearchParams(location.search||'');
    var t=p.get('t')||p.get('token')||'';
    if(!t && location.hash) t=location.hash.replace(/^#/,'');
    var nr=p.get('nr')||'';
    var pv=p.get('preview')||'';
    if(!t) return '';
    return 't='+encodeURIComponent(t)+(nr?('&nr='+encodeURIComponent(nr)):'')+(pv?('&preview='+encodeURIComponent(pv)):'');
  }

  window.__trackCb=function(r){
    if(!r){ showErr('Verbindungsfehler, bitte neu laden.'); return; }
    if(!r.ok){
      if(r.wartung){ showErr('Die Sendungsverfolgung wird gerade vorbereitet und ist in Kuerze fuer Dich verfuegbar. Bitte etwas spaeter erneut oeffnen.'); return; }
      if(r.klarstellung){ showErr('Fuer diesen Auftrag steht die Online-Verfolgung nicht zur Verfuegung. Bei Fragen zum Status melde Dich gern direkt bei uns.'); return; }
      showErr(r.notFound ? 'Auftrag nicht gefunden. Bitte den persoenlichen Link aus Deiner Bestaetigung oeffnen.' : 'Der Tracking-Dienst ist gerade nicht erreichbar, bitte spaeter erneut versuchen.'); return;
    }
    q('#loadwrap').style.display='none';
    q('#main').style.display='';
    ersteAntwort=true;
    document.title='TEXTRA '+r.nr;
    setText('.hero-nr', r.nr);
    setText('.hero-firma', r.firma);
    var pill=q('.pill'); pill.className='pill'+(String(r.statusLabel||'').indexOf('Bereit zur Abholung')>=0?' bereit':''); pill.innerHTML='<div class="sdot"></div>'+esc(r.statusLabel);
    var dw=q('#dpdwrap');
    if(r.dpdLink && r.versandNr){
      dw.innerHTML='<a href="'+esc(r.dpdLink)+'" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:11px;text-decoration:none;background:rgba(0,173,239,0.07);border:1px solid rgba(0,173,239,0.35);border-radius:100px;padding:8px 15px 8px 12px">'
        +'<img src="'+DPDLOGO+'" alt="DPD" style="height:22px;display:block">'
        +'<div><div style="font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#6c8298">Sendungsverfolgung</div>'
        +'<div style="font-size:15px;font-weight:800;color:#00ADEF;letter-spacing:0.3px">'+esc(r.versandNr)+'</div></div></a>';
    } else { dw.innerHTML=''; }
    q('#rueckwrap').innerHTML=r.rueckHinweis||'';
    setText('.prog-num', r.prozent+'%');
    q('.pfill').style.width=r.prozent+'%';
    setText('#ic-vered', r.profil);
    setText('#ic-lief', r.lieferart);
    setText('#ic-term-l', (String(r.lieferart||'').indexOf('bholung')>=0?'Geplante Fertigstellung':'Geplanter Liefertermin'));
    q('#ic-term-v').innerHTML=(r.terminAnzeige||'Auf Anfrage');
    setText('.st-c', r.schrittInfo);
    var sl=q('.steps-list'); sl.innerHTML=r.timelineHTML||'';
    var total=parseInt(String(r.schrittInfo||'').split('/')[1],10)||0;
    sl.className='steps-list'+(total>=8?' cols2':'');
    fertig=!!r.istFertig;
  };

  var PARAM=param();
  if(!PARAM){ showErr('Bitte den persoenlichen Tracking-Link mit Auftragsnummer oeffnen.'); return; }

  function load(){
    var s=document.createElement('script');
    s.src=EXEC+'?action=trackjson&callback=__trackCb&'+PARAM+'&_='+Date.now();
    s.onerror=function(){ if(!ersteAntwort) showErr('Verbindung fehlgeschlagen, bitte neu laden.'); };
    document.body.appendChild(s);
    setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 20000);
  }
  load();
  setInterval(function(){ if(!fertig && !document.hidden) load(); }, 30000);
})();
</script>
